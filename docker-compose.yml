# Float, Assignment 2: the whole system with one command, `docker compose up --build`.
# One SQL Server holding one database per service, a one-off script that creates those databases and
# their logins, the two service containers, and a stock nginx serving the static UI (not a service
# container: no Dockerfile, the ui/ folder is mounted read-only).
# Every password and secret comes from .env (copy .env.example), never from this file.
name: float

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64  # no arm64 image; on Apple Silicon turn on Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql  # data survives `down` and rebuilds; only `down -v` deletes it
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      PERSONAL_DB_PASSWORD: ${PERSONAL_DB_PASSWORD:?set PERSONAL_DB_PASSWORD in .env}
      HOUSEHOLDS_DB_PASSWORD: ${HOUSEHOLDS_DB_PASSWORD:?set HOUSEHOLDS_DB_PASSWORD in .env}
    volumes:
      - ./db/init.sql:/init/init.sql:ro
    # sqlcmd reads environment variables as scripting variables, so $(PERSONAL_DB_PASSWORD) in
    # init.sql is filled in without the password ever appearing on the command line.
    entrypoint: ["/bin/sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /init/init.sql"]
    restart: "no"

  personal:
    build:
      context: ./services/personal
      args:
        GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://personal_svc:${PERSONAL_DB_PASSWORD}@db:1433/personal
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      HOUSEHOLDS_URL: http://households:8000  # the other service, found by its compose name
      HOUSEHOLDS_TIMEOUT_S: "2"
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  households:
    build:
      context: ./services/households
      args:
        GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://households_svc:${HOUSEHOLDS_DB_PASSWORD}@db:1433/households
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      PERSONAL_URL: http://personal:8000
      PERSONAL_TIMEOUT_S: "2"
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"  # http://localhost:8080, the origin both services allow (CORS_ORIGINS)

volumes:
  mssql-data:
