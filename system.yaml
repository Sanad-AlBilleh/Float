# yaml-language-server: $schema=./system.schema.json
# Float's system description (Assignment 2 §8a): every service, its configuration, its calls across the
# seam and its Azure resources. It must match the code (services/*/app/config.py) and the deployment.
student: sgealbilleh.ieu2024
prefix: sgealbilleh-ieu2024
# The storage account's static website endpoint.
public_url: https://sgealbillehieu2024ui.z1.web.core.windows.net
ui:
  path: ui
  storage_account: sgealbillehieu2024ui
  calls: [personal, households]
azure:
  resource_group: rg-sgealbilleh-ieu2024
  container_apps_environment: sgealbilleh-ieu2024-env
  sql_server: sgealbilleh-ieu2024-sql
  registry: ghcr.io/sanad-albilleh
services:
  personal:
    description: Accounts and sign-in, the ledger, bills, goals, budgets, safe-to-spend, the forecast and alerts.
    path: services/personal
    openapi: services/personal/openapi.json
    port_default: 8000
    health: /health
    migrations: services/personal/migrations
    env:
      PORT: { default: 8000, description: "Port the service listens on" }
      DATABASE_URL: { secret: true, description: "Connection string of the personal database (mssql://user:password@host:1433/db)" }
      TOKEN_SECRET: { secret: true, description: "Signs sign-in tokens; shared with households, which checks them" }
      INTERNAL_API_KEY: { secret: true, description: "Required on /internal calls between the services" }
      HOUSEHOLDS_URL: { default: "http://households:8000", description: "Base URL of the households service" }
      HOUSEHOLDS_TIMEOUT_S: { default: 10, description: "Timeout in seconds for every call to households; 10 allows for the other app starting from zero on Azure (compose sets 2)" }
      CORS_ORIGINS: { default: "http://localhost:8080", description: "The UI's origin, the only one allowed from a browser" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health" }
      APP_TIMEZONE: { default: Europe/Madrid, description: "Time zone for \"today\"" }
      DB_CONNECT_RETRIES: { default: 8, description: "Connection retries at startup while a paused database resumes" }
      SESSION_IDLE_HOURS: { default: 48, description: "A session ends after this long unused" }
      SESSION_MAX_DAYS: { default: 14, description: "A session ends after this long in any case" }
    calls:
      - service: households
        url_env: HOUSEHOLDS_URL
        endpoints: ["GET /internal/users/{user_id}/position", "GET /internal/users/{user_id}/shares", "GET /internal/users/{user_id}/events"]
        timeout_s: 10
        on_failure: The dashboard is shown without household terms and says household balances are unavailable; alerts are left unchanged.
    azure:
      container_app: sgealbilleh-ieu2024-personal
      sql_database: sgealbilleh-ieu2024-personal-db
  households:
    description: Households, members, invitations, shared expenses, balances, settlements and household bills.
    path: services/households
    openapi: services/households/openapi.json
    port_default: 8000
    health: /health
    migrations: services/households/migrations
    env:
      PORT: { default: 8000, description: "Port the service listens on" }
      DATABASE_URL: { secret: true, description: "Connection string of the households database (mssql://user:password@host:1433/db)" }
      TOKEN_SECRET: { secret: true, description: "Checks the sign-in tokens the personal service signs" }
      INTERNAL_API_KEY: { secret: true, description: "Required on /internal calls between the services" }
      PERSONAL_URL: { default: "http://personal:8000", description: "Base URL of the personal service" }
      PERSONAL_TIMEOUT_S: { default: 10, description: "Timeout in seconds for every call to personal; 10 allows for the other app starting from zero on Azure (compose sets 2)" }
      CORS_ORIGINS: { default: "http://localhost:8080", description: "The UI's origin, the only one allowed from a browser" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health" }
      APP_TIMEZONE: { default: Europe/Madrid, description: "Time zone for \"today\"" }
      DB_CONNECT_RETRIES: { default: 8, description: "Connection retries at startup while a paused database resumes" }
    calls:
      - service: personal
        url_env: PERSONAL_URL
        endpoints: ["GET /internal/users", "GET /internal/users/{user_id}/profile", "POST /internal/transactions", "PATCH /internal/transactions/{transaction_id}", "DELETE /internal/transactions/{transaction_id}"]
        timeout_s: 10
        on_failure: Households, balances and settlements are still shown with names as "Member #id"; anything that records money answers 503 "Ledger unavailable, nothing was saved".
    azure:
      container_app: sgealbilleh-ieu2024-households
      sql_database: sgealbilleh-ieu2024-households-db
