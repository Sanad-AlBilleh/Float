# CI (Assignment 2 §5): every push to a branch, every pull request, and as the first job of CD on main.
# Gates: the system description matches the code, lint, tests with ≥70% coverage per service against a
# SQL Server container (never Azure SQL), the cross-seam integration test, and every image builds.
name: CI

on:
  push:
    branches-ignore: [main]  # main is covered by CD, which calls this workflow first
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: System description and OpenAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml==6.0.2 check-jsonschema==0.33.2 openapi-spec-validator==0.7.2
      - name: system.yaml matches the code (env vars, cross-seam endpoints, paths)
        run: python scripts/check_system.py
      - name: system.yaml is valid against system.schema.json
        run: |
          if [ -f system.schema.json ]; then
            check-jsonschema --schemafile system.schema.json system.yaml
          else
            echo "::warning::system.schema.json is missing: copy it from Blackboard to the repository root"
          fi
      - name: Each OpenAPI document is valid
        run: openapi-spec-validator services/personal/openapi.json services/households/openapi.json

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [personal, households]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Start a throwaway SQL Server (password made up for this run only)
        run: |
          PASSWORD="Ci$(openssl rand -hex 16)Aa1"
          echo "::add-mask::${PASSWORD}"
          echo "TEST_DATABASE_URL=mssql://sa:${PASSWORD}@localhost:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=${PASSWORD}" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "${PASSWORD}" -Q "SELECT 1" -b -o /dev/null && exit 0
            sleep 2
          done
          docker logs mssql; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: The committed OpenAPI document matches the code
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json
      - name: Tests with coverage (fails below 70%)
        run: pytest --cov --cov-report=term --cov-fail-under=70

  integration:
    name: Cross-seam integration test (compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for this run only
        run: |
          {
            echo "MSSQL_SA_PASSWORD=Ci$(openssl rand -hex 16)Aa1"
            echo "PERSONAL_DB_PASSWORD=Ci$(openssl rand -hex 16)Pp1"
            echo "HOUSEHOLDS_DB_PASSWORD=Ci$(openssl rand -hex 16)Hh1"
            echo "TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo "GIT_SHA=${GITHUB_SHA}"
          } > .env
      - name: Start the whole system
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8001/health && curl -fsS http://localhost:8002/health && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest==9.1.1 httpx2==2.13.1
      - run: pytest tests/integration -v
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [personal, households]
    steps:
      - uses: actions/checkout@v4
      - name: docker build (a failed build fails the pipeline)
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA} -t float-${{ matrix.service }}:ci services/${{ matrix.service }}
