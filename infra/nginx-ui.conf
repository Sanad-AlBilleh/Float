# Local only: how the stock nginx image serves ui/ (mounted by docker-compose.yml).
# "no-cache" makes the browser check for a newer file each time (a cheap ETag check), so a changed
# script is never stale. On Azure the CD pipeline uploads the files with the same Cache-Control.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location / {
        try_files $uri $uri/ =404;
    }
}
